[project]
name = "examprep"
version = "0.1.0"
description = "Exam answer generation from lecture recordings"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "yt-dlp>=2025.1.15",
    "httpx>=0.27",
    "openai>=1.50",
    "rank-bm25>=0.2.2",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# ASR отдельно от GPU: на ноутбуке faster-whisper ставится без torch,
# чтобы прогнать одну лекцию на CPU и проверить формат транскрипта.
asr = [
    "faster-whisper>=1.0.3",
]
gpu = [
    "faster-whisper>=1.0.3",
    "torch>=2.4",
    "sentence-transformers>=3.1",
]

[project.scripts]
examprep = "examprep.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examprep"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Тексты для пользователя на русском: проверка «похожих» символов бесполезна.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["examprep"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "examprep.schemas"
strict = true

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "faster_whisper.*", "ctranslate2.*", "torch.*", "sentence_transformers.*", "rank_bm25.*", "pymorphy3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
