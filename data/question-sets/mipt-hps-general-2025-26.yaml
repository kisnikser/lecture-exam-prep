schema_version: 1
id: mipt-hps-general-2025-26
title: "Основные вопросы к кандидатскому экзамену по истории и философии науки"
description: "Для аспирантов первого года обучения МФТИ, 2025/2026 учебный год. Первый вопрос экзаменационного билета."
kind: general
questions:
  - {id: g01, number: 1, text: "Предметное поле философии науки. Место философии науки в системе философского знания. Наука как социальный институт."}
  - {id: g02, number: 2, text: "Наука как форма познания. Соотношение науки, обыденного знания, религии и искусства."}
  - {id: g03, number: 3, text: "Научные программы античности: атомистическая и математическая (пифагорейско-платоновская)."}
  - {id: g04, number: 4, text: "Научная программа Аристотеля."}
  - {id: g05, number: 5, text: "Научная и инженерно-техническая мысль в эпоху Возрождения."}
  - {id: g06, number: 6, text: "Научная революция Нового времени: причины, основные направления и представители."}
  - {id: g07, number: 7, text: "Философия и методология эмпиризма 17 в. (Ф. Бэкон, Т. Гоббс, Дж. Локк)."}
  - {id: g08, number: 8, text: "Философия и методология рационализма 17 в. (Р. Декарт, Б. Спиноза, Г. Лейбниц)."}
  - {id: g09, number: 9, text: "Феноменалистическая критика основных понятий и принципов классической науки (Дж. Беркли, Д. Юм)."}
  - {id: g10, number: 10, text: "Концепция научного знания И. Канта. Понятие «чистого разума». Феномены и ноумены. Априорные формы чувственности и категории рассудка. Антиномии разума. Границы теоретического познания."}
  - {id: g11, number: 11, text: "Понимание научного знания в концепциях «первого» позитивизма (О. Конт, Дж. С. Милль, Г. Спенсер). Критика метафизики."}
  - {id: g12, number: 12, text: "Революция в естествознании конца XIX — первой трети XX вв."}
  - {id: g13, number: 13, text: "Концепции научного знания «второго» позитивизма (Э. Мах, А. Пуанкаре, П. Дюгем)."}
  - {id: g14, number: 14, text: "Логический атомизм Б. Рассела и Л. Витгенштейна."}
  - {id: g15, number: 15, text: "Логический позитивизм «Венского кружка». Эмпирический базис. Проблема демаркации научного знания. Верификационизм."}
  - {id: g16, number: 16, text: "К. Поппер и его философия науки. Фальсификационизм. Концепция «трех миров»."}
  - {id: g17, number: 17, text: "Концепция научных революций Т. Куна."}
  - {id: g18, number: 18, text: "Концепция научно-исследовательских программ И. Лакатоса."}
  - {id: g19, number: 19, text: "Эпистемологический анархизм П. Фейерабенда."}
  - {id: g20, number: 20, text: "Эмпирическое познание. Споры вокруг понятия факта. Способы получения фактов в естествознании: наблюдение, эксперимент, измерение."}
  - {id: g21, number: 21, text: "Теоретическое познание. Проблема. Идея. Гипотеза. Теория."}
  - {id: g22, number: 22, text: "Понятие научного метода. Общенаучные и частные методы познания."}
  - {id: g23, number: 23, text: "Понятие истины. Корреспондентная, когерентная, конвенциональная и прагматическая концепции истины."}
  - {id: g24, number: 24, text: "Детерминизм и причинность (каузальность). Концепция вероятностной причинности в квантовой физике."}
  - {id: g25, number: 25, text: "Время и пространство. Субстанциальные и реляционные концепции времени и пространства. Философские проблемы теории относительности."}
  - {id: g26, number: 26, text: "Современные дискуссии об искусственном интеллекте. Физикалистские, антифизикалистские и другие модели сознания."}
