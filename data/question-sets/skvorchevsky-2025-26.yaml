schema_version: 1
id: skvorchevsky-2025-26
title: "Вопросы к кандидатскому экзамену по курсу К. А. Скворчевского «История и философия науки»"
description: "Для аспирантов, 2025/2026 учебный год. Второй вопрос экзаменационного билета."
kind: course
questions:
  - {id: s01, number: 1, text: "Основные проблемы современной философии науки и ключевые направления их решения."}
  - {id: s02, number: 2, text: "Категории истины, мышления, идеального, причинности, законосообразности и материи в процессе формирования научной методологии Античности и Средних веков."}
  - {id: s03, number: 3, text: "Методология физики и космологии Аристотеля."}
  - {id: s04, number: 4, text: "Смысл и содержание научной революции Нового времени."}
  - {id: s05, number: 5, text: "Вклад Ф. Бэкона в развитие методологии европейской науки."}
  - {id: s06, number: 6, text: "Обоснование научной методологии в трудах Р. Декарта. Система деятельности ученого по Р. Декарту."}
  - {id: s07, number: 7, text: "«Методологические правила» И. Ньютона."}
  - {id: s08, number: 8, text: "Парижская политехническая школа. «Великая французская революция в физике»."}
  - {id: s09, number: 9, text: "Модель университета В. Гумбольдта. Становление теоретической физики в XIX веке."}
  - {id: s10, number: 10, text: "«Предметный кризис» в европейской философии XIX в. Возникновение «первого позитивизма». О. Конт. Дж. Милль. Г. Спенсер. У. Уэвелл."}
  - {id: s11, number: 11, text: "«Второй позитивизм». А. Пуанкаре. Э. Мах. П. Дюгем."}
  - {id: s12, number: 12, text: "«Неопозитивизм». Деятельность «Венского кружка». Роль концепции Л. Витгенштейна в развитии логического позитивизма."}
  - {id: s13, number: 13, text: "Концепция развития науки К. Поппера. Принцип фальсификации. Идея «третьего мира»."}
  - {id: s14, number: 14, text: "Концепция научных революций Т. Куна."}
  - {id: s15, number: 15, text: "Концепция роста научного знания И. Лакатоса. «Эпистемологический анархизм» П. Фейерабенда."}
  - {id: s16, number: 16, text: "Вклад работ У. Куайна и философии языка Л. Витгенштейна в критику неопозитивизма."}
  - {id: s17, number: 17, text: "Эволюционная эпистемология. К. Лоренц. К. Поппер. С. Тулмин."}
  - {id: s18, number: 18, text: "Концепция личностного знания М. Полани."}
  - {id: s19, number: 19, text: "Концепции Л. Лаудана и Б. ван Фраассена как примеры современных подходов к решению основных проблем философии науки."}
  - {id: s20, number: 20, text: "Основные направления развития аналитической философии в 40-х – 90-х годах XX века."}
  - {id: s21, number: 21, text: "Возможность использования концепций философской феноменологии и философии постмодернизма в анализе процессов развития научного знания."}
